spring:
  application:
    name: backend
  profiles:
    default: dev
  config:
    import: "optional:file:./.env[.properties]"

server:
  port: 8080
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: ${auth.cookie-secure}
        same-site: lax

auth:
  cookie-secure: true
