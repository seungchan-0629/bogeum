spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      s3:
        enabled: true # false = S3 작동 X
        bucket: ${AWS_S3_BUCKET}
      region:
        static: ${AWS_REGION}
  servlet:
    # multipart 파싱 단계의 제한이며 디코딩 전 파일·픽셀 검사는 as-image 설정을 사용한다.
    multipart:
      max-file-size: ${AS_IMAGE_MAX_FILE_SIZE:20MB}
      max-request-size: ${AS_IMAGE_MAX_REQUEST_SIZE:205MB}

auth:
  cookie-secure: false

# 초기 기술값이며 확정된 팀 정책이 아니다.
as-image:
  max-count: ${AS_IMAGE_MAX_COUNT:10}
  max-bytes: ${AS_IMAGE_MAX_BYTES:20971520}
  max-pixels: ${AS_IMAGE_MAX_PIXELS:40000000}
  max-dimension: ${AS_IMAGE_MAX_DIMENSION:2048}
  jpeg-quality: ${AS_IMAGE_JPEG_QUALITY:0.85}
  formats: ${AS_IMAGE_FORMATS:JPEG,PNG}

solapi:
  api-key: ${SOLAPI_API_KEY}
  api-secret: ${SOLAPI_API_SECRET}
  sender-number: ${SOLAPI_SENDER_NUMBER}